<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billy: just tell Billy who to bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--bg:#EAF0FC;--ink:#0A1230;--mut:#5A6785;--line:#D3DCF0;--card:#fff;--soft:#F1F5FD;--blue:#2B4BFF;--mint:#0FB388;--amber:#F07A1E;--rose:#E5384B;--violet:#8B5CF6;--paper:#fff;--pi:#0A1230;--pm:#6B7794;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#070B1A;--ink:#EAF0FF;--mut:#8B99B8;--line:#1D2745;--card:#0E1530;--soft:#131C3A;--blue:#5B7BFF;--mint:#2FD6A6;--amber:#FF9A4D;--rose:#FF6577;--violet:#A98BFF;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;color:var(--ink);font:500 16px/1.5 Manrope,system-ui,sans-serif;background:radial-gradient(900px 520px at 90% -8%,color-mix(in srgb,var(--blue) 24%,transparent),transparent 62%),radial-gradient(700px 520px at -12% 28%,color-mix(in srgb,var(--mint) 16%,transparent),transparent 62%),var(--bg);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 56px;display:grid;gap:40px}
@media(min-width:920px){.wrap{max-width:1080px;grid-template-columns:1.05fr .95fr;gap:56px;padding-top:28px}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font:800 24px "Bricolage Grotesque",sans-serif;letter-spacing:-.5px}
.eyes{transform-origin:16px 14px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pill{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
h1{font:800 clamp(46px,9vw,78px)/.96 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em;margin:6px 0 22px}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln>span{display:block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.ln:nth-child(2)>span{animation-delay:.1s;color:var(--blue)}
@keyframes rise{to{transform:none}}
.comp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 22px 44px -24px color-mix(in srgb,var(--ink) 40%,transparent);overflow:hidden}
.comp.busy::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:40%;background:linear-gradient(90deg,transparent,var(--blue),var(--mint),transparent);animation:sweep 1s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
textarea#msg{width:100%;min-height:96px;border:0;background:transparent;resize:none;font:600 20px/1.35 Manrope,sans-serif;outline:0}
textarea::placeholder{color:var(--mut);opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;transition:border-color .2s,color .2s}
.chips button:hover{border-color:var(--blue);color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:99px;padding:14px 24px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 12px 26px -12px var(--blue);transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 16px 30px -12px var(--blue);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.full{width:100%}
.ghost{background:none;border:0;color:var(--blue);font-weight:700;padding:8px 10px;border-radius:10px;cursor:pointer;text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.comp[data-s=read] #msg,.comp[data-s=read] .chips,.comp[data-s=read] #go{display:none}
.comp[data-s=write] .readwrap{display:none}
#read{font:600 22px/1.5 Manrope,sans-serif;margin:2px 0 8px}
mark{background:linear-gradient(var(--c),var(--c)) left 100%/0 3px no-repeat,color-mix(in srgb,var(--c) 13%,transparent);color:inherit;border-radius:5px;padding:0 3px 2px;animation:ul .55s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:calc(var(--k)*.18s + .15s)}
@keyframes ul{to{background-size:100% 3px,auto}}
mark.n{--c:var(--blue)}mark.a{--c:var(--mint)}mark.i{--c:var(--violet)}mark.d{--c:var(--amber)}
.err{display:flex;gap:8px;color:var(--rose);font-weight:600;margin:12px 4px 0}.err:empty{display:none}
.slot{overflow:hidden;padding:0 0 26px;margin-top:22px}
.paper{position:relative;background:var(--paper);color:var(--pi);border-radius:18px 18px 0 0;padding:22px 20px 8px;filter:drop-shadow(0 14px 18px rgba(10,18,48,.16))}
.paper::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -7px 0,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -7px 0;background-size:14px 14px}
.paper.in{animation:print .9s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(-104%)}}
.ph{display:flex;justify-content:space-between;align-items:baseline;font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin-bottom:6px}
.ph span{font:600 14px Manrope;color:var(--pm)}
.f{display:block;padding:11px 0 9px;border-bottom:1px dashed #CBD3E6;position:relative;padding-left:14px}
.f::before{content:"";position:absolute;left:0;top:14px;bottom:12px;width:4px;border-radius:4px;background:#CBD3E6}
.f.n::before{background:var(--blue)}.f.a::before{background:var(--mint)}.f.i::before{background:var(--violet)}.f.d::before{background:var(--amber)}
.f span{display:block;font-size:13px;color:var(--pm);font-weight:600}
.f input{width:100%;border:0;background:transparent;color:var(--pi);font:700 18px Manrope,sans-serif;padding:2px 0;outline:0;min-width:0}
.f input:focus{box-shadow:0 2px 0 var(--blue)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 18px}
.total span{color:var(--pm);font-weight:600}
.total b{font:800 42px "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:16px;top:70px;border:3px double var(--mint);color:var(--mint);border-radius:10px;padding:4px 14px;font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:.06em;opacity:0;transform:rotate(-9deg) scale(2.4);pointer-events:none}
.stamp.on{animation:stamp .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{to{opacity:.95;transform:rotate(-9deg) scale(1)}}
.done{margin-top:14px;font-weight:600}.done a{color:var(--blue)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}
h2{font:800 28px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st{padding:4px 0}.st small{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:14px}.st small i{width:8px;height:8px;border-radius:50%}
.st b{display:block;font:800 clamp(22px,5.4vw,30px) "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line);animation:in .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.07s + .25s)}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px "Bricolage Grotesque",sans-serif;background:linear-gradient(135deg,hsl(var(--h) 80% 55%),hsl(calc(var(--h) + 40) 80% 45%))}
.rb{flex:1;min-width:0}
.r1,.r2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.r1 b{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:800 18px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.r2{color:var(--mut);font-size:14px;font-weight:600;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip.PAID{--c:var(--mint)}.chip.OVERDUE{--c:var(--rose)}.chip.SENT,.chip.UNPAID{--c:var(--amber)}.chip.DRAFT,.chip.CANCELLED{--c:var(--mut)}
.acts{display:flex;gap:2px;margin:4px 0 0 -10px}
.empty{color:var(--mut);padding:22px 0;border-top:1px solid var(--line)}
dialog{border:0;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--ink)}
@media(min-width:640px){dialog{border-radius:26px;margin:auto}}
dialog[open]{animation:up .4s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
dialog::backdrop{background:rgba(7,11,26,.55);backdrop-filter:blur(3px)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px;margin:14px 0}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--card);border-radius:99px;box-shadow:0 2px 8px rgba(10,18,48,.15);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.seg[data-t=firm] i{transform:translateX(100%)}
.seg button{position:relative;background:none;border:0;padding:10px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{color:var(--ink)}
#rm{min-height:140px;white-space:pre-wrap;font-size:17px;line-height:1.55;background:var(--soft);border-radius:16px;padding:16px;margin-bottom:14px}
.foot{grid-column:1/-1;color:var(--mut);font-size:14px;text-align:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.ln>span{transform:none}}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){document.body.insertAdjacentHTML("afterbegin",'<pre style="background:#900;color:#fff;padding:10px;white-space:pre-wrap;position:relative;z-index:99">'+m+" (line "+l+")</pre>")}</script>
<div class="wrap">
<header>
<div class="logo"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="2" width="26" height="28" rx="9" fill="var(--blue)"/><g class="eyes"><circle cx="12" cy="14" r="2.6" fill="#fff"/><circle cx="20" cy="14" r="2.6" fill="#fff"/></g><path d="M11 21c2.6 2.4 7.4 2.4 10 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Billy</div>
<div class="pill"><i></i>Sandbox mode</div>
</header>

<div>
<h1><span class="ln"><span>Tell Billy</span></span><span class="ln"><span>who to bill.</span></span></h1>
<div class="comp" id="comp" data-s="write">
<textarea id="msg" placeholder="Invoice Ada $50 for logo design, due in 7 days. Her email is ada@example.com"></textarea>
<div class="chips" id="chips"><button>Invoice Ada $50 for logo design, due in 7 days</button><button>Bill Chidi $120 for website fixes, due Friday</button><button>Invoice Zainab $35 for cake order, due tomorrow</button></div>
<button class="btn full" id="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>Make invoice</button>
<div class="readwrap"><div id="read"></div><button class="ghost" id="edit">Change message</button></div>
</div>
<div class="err" id="err" role="alert"></div>

<div class="slot" id="slot" hidden>
<div class="paper" id="paper">
<div class="ph">Invoice<span>Draft</span></div>
<label class="f n"><span>Billed to</span><input id="f-name" autocomplete="off"></label>
<label class="f"><span>Client email</span><input id="f-email" type="email" autocomplete="off"></label>
<div class="two"><label class="f i"><span>For</span><input id="f-desc" autocomplete="off"></label><label class="f a"><span>Amount</span><input id="f-amt" type="number" step="0.01" min="0" inputmode="decimal"></label></div>
<label class="f d"><span>Due date</span><input id="f-due" type="date"></label>
<input id="f-cur" type="hidden">
<div class="total"><span>Total due</span><b id="tot">$0.00</b></div>
<div class="stamp" id="stamp">SENT</div>
</div>
</div>
<button class="btn full" id="send" hidden>Send with PayPal</button>
<div class="done" id="done"></div>
</div>

<section>
<div class="sh"><h2>Your invoices</h2><button class="ghost" id="refresh">Refresh</button></div>
<div class="stats" id="stats"></div>
<div id="list"><p class="empty">Loading your invoices…</p></div>
</section>
<p class="foot">Built for the PayPal AI Hackathon. Sandbox payments only, no real money moves.</p>
</div>

<dialog id="dlg">
<h2>Payment reminder</h2>
<div class="seg" id="seg" data-t="polite"><i></i><button data-t="polite" class="on">Polite</button><button data-t="firm">Firm</button></div>
<div id="rm" role="status"></div>
<div style="display:flex;gap:8px"><button class="btn" id="copy">Copy message</button><button class="ghost" id="close">Close</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=(n,c)=>{try{return new Intl.NumberFormat("en",{style:"currency",currency:c||"USD"}).format(n||0)}catch{return (n||0)+" "+c}};
const fd=s=>s?new Date(s+"T00:00:00").toLocaleDateString("en",{month:"short",day:"numeric"}):"-";
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const LABEL={PAID:"Paid",SENT:"Sent",UNPAID:"Unpaid",OVERDUE:"Overdue",DRAFT:"Draft",CANCELLED:"Cancelled"};
let INV=[],cur=null,tone="polite",msgText="",timer;
async function api(p,body){
  const r=await fetch(p,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||"Something went wrong. Try again.");
  return d;
}
function hl(text,d){
  const L=text.toLowerCase(),m=[];
  const add=(i,l,c)=>{if(i>=0&&l>0&&!m.some(x=>i<x[0]+x[1]&&x[0]<i+l))m.push([i,l,c])};
  const nm=d.client_name.toLowerCase();add(L.indexOf(nm),nm.length,"n");
  const am=text.match(/[$€£]?\s?\d[\d,]*(?:\.\d+)?/);if(am)add(am.index,am[0].length,"a");
  const ds=d.description.toLowerCase();add(L.indexOf(ds),ds.length,"i");
  const du=text.match(/due[^,.;]*/i);if(du)add(du.index,du[0].length,"d");
  m.sort((a,b)=>a[0]-b[0]);
  let o="",p=0;m.forEach(([i,l,c],k)=>{o+=esc(text.slice(p,i))+`<mark class="${c}" style="--k:${k}">${esc(text.slice(i,i+l))}</mark>`;p=i+l});
  return o+esc(text.slice(p));
}
const total=()=>{$("#tot").textContent=money($("#f-amt").value,$("#f-cur").value||"USD")};
$("#f-amt").oninput=total;
$("#chips").onclick=e=>{if(e.target.tagName==="BUTTON"){$("#msg").value=e.target.textContent;$("#msg").focus()}};
$("#edit").onclick=()=>{$("#comp").dataset.s="write";$("#msg").focus()};
$("#go").onclick=async()=>{
  const b=$("#go"),text=$("#msg").value;$("#err").textContent="";b.disabled=true;$("#comp").classList.add("busy");
  try{
    const d=await api("/api/parse",{text});
    $("#f-name").value=d.client_name;$("#f-email").value=d.client_email;$("#f-desc").value=d.description;
    $("#f-amt").value=d.amount;$("#f-due").value=d.due_date;$("#f-cur").value=d.currency;total();
    $("#read").innerHTML=hl(text,d);$("#comp").dataset.s="read";
    const p=$("#paper");$("#slot").hidden=false;$("#send").hidden=false;$("#send").disabled=false;$("#send").textContent="Send with PayPal";
    $("#stamp").classList.remove("on");$("#done").textContent="";p.classList.remove("in");void p.offsetWidth;p.classList.add("in");
    setTimeout(()=>$("#slot").scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"}),350);
    if(!d.client_email)$("#f-email").focus({preventScroll:true});
  }catch(x){$("#err").textContent=x.message}
  b.disabled=false;$("#comp").classList.remove("busy");
};
$("#send").onclick=async()=>{
  const b=$("#send");$("#err").textContent="";b.disabled=true;b.textContent="Sending…";
  try{
    const d=await api("/api/send",{client_name:$("#f-name").value,client_email:$("#f-email").value,description:$("#f-desc").value,amount:$("#f-amt").value,currency:$("#f-cur").value,due_date:$("#f-due").value});
    $("#stamp").classList.add("on");b.textContent="Sent";
    $("#done").innerHTML=d.link?`PayPal emailed the invoice. <a href="${esc(d.link)}" target="_blank" rel="noopener">Open the pay link</a>`:"PayPal emailed the invoice.";
    load();
  }catch(x){$("#err").textContent=x.message;b.disabled=false;b.textContent="Send with PayPal"}
};
function count(el,to,c){
  if(reduce){el.textContent=money(to,c);return}
  const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);el.textContent=money(to*e,c);if(p<1)requestAnimationFrame(f)})(t0);
}
async function load(){
  try{
    INV=(await api("/api/invoices")).items;
    const c=(INV[0]&&INV[0].currency)||"USD",sum=f=>INV.filter(f).reduce((a,i)=>a+Number(i.amount||0),0);
    const g=[["Paid","var(--mint)",sum(i=>i.status==="PAID")],["Waiting","var(--amber)",sum(i=>["SENT","UNPAID","PARTIALLY_PAID","PAYMENT_PENDING"].includes(i.status))],["Overdue","var(--rose)",sum(i=>i.status==="OVERDUE")]];
    $("#stats").innerHTML=g.map(x=>`<div class="st"><small><i style="background:${x[1]}"></i>${x[0]}</small><b></b></div>`).join("");
    document.querySelectorAll(".st b").forEach((el,k)=>count(el,g[k][2],c));
    const today=new Date(new Date().toDateString());
    $("#list").innerHTML=INV.length?INV.map((i,n)=>{
      const ini=i.client.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(),hue=[...i.client].reduce((a,ch)=>a+ch.charCodeAt(0),0)%360;
      const late=Math.round((today-new Date(i.due+"T00:00:00"))/864e5);
      const when=i.status==="PAID"?"Paid in full":i.status==="OVERDUE"?`${late} day${late===1?"":"s"} late`:"Due "+fd(i.due);
      const open=!["PAID","CANCELLED","DRAFT"].includes(i.status);
      return `<div class="row" style="--i:${n}"><div class="av" style="--h:${hue}">${esc(ini)}</div><div class="rb"><div class="r1"><b>${esc(i.client)}</b><span class="amt">${esc(money(i.amount,i.currency))}</span></div><div class="r2"><span>${esc(when)}</span><span class="chip ${esc(i.status)}"><i></i>${esc(LABEL[i.status]||i.status)}</span></div><div class="acts">${i.link?`<a class="ghost" href="${esc(i.link)}" target="_blank" rel="noopener">Open invoice</a>`:""}${open?`<button class="ghost" data-n="${n}">Write reminder</button>`:""}</div></div></div>`}).join(""):'<p class="empty">No invoices yet. Tell Billy who to bill and it will show up here.</p>';
  }catch(x){$("#list").innerHTML=`<p class="err">${esc(x.message)}</p>`}
}
$("#refresh").onclick=load;
$("#list").onclick=e=>{const n=e.target.dataset.n;if(n==null)return;cur=INV[n];tone="polite";setTone();$("#dlg").showModal();remind()};
function setTone(){$("#seg").dataset.t=tone;document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===tone))}
$("#seg").onclick=e=>{if(e.target.dataset.t){tone=e.target.dataset.t;setTone();remind()}};
function typeOut(t){
  clearInterval(timer);msgText=t;const el=$("#rm");if(reduce){el.textContent=t;return}
  let i=0;el.textContent="";timer=setInterval(()=>{i+=3;el.textContent=t.slice(0,i);if(i>=t.length)clearInterval(timer)},18);
}
async function remind(){
  clearInterval(timer);$("#rm").textContent="Billy is writing…";
  try{const d=await api("/api/reminder",{client:cur.client,amount:cur.amount,currency:cur.currency,due:cur.due,status:cur.status,tone});typeOut(d.message)}
  catch(x){$("#rm").textContent=x.message}
}
$("#copy").onclick=async e=>{try{await navigator.clipboard.writeText(msgText);e.target.textContent="Copied"}catch{e.target.textContent="Select and copy"}setTimeout(()=>e.target.textContent="Copy message",1600)};
$("#close").onclick=()=>$("#dlg").close();
load();
</script>
</body>
</html>
